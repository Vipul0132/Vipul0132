<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="phone-mockup">
            <img src="https://www.instagram.com/static/images/homepage/phones/home-phones.png/43cc71bb1b43.png" alt="Instagram phones">
        </div>
        
        <div class="login-section">
            <div class="login-box">
                <div class="logo">
                    <h1>Instagram</h1>
                </div>
                
                <form id="loginForm">
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Phone number, username, or email" 
                        required
                    >
                    
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Password" 
                        required
                    >
                    
                    <button type="submit" id="loginBtn">Log In</button>
                </form>
                
                <div class="divider">
                    <div class="line"></div>
                    <span>OR</span>
                    <div class="line"></div>
                </div>
                
                <div class="facebook-login">
                    <a href="#" onclick="return false;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951z"/>
                        </svg>
                        Log in with Facebook
                    </a>
                </div>
                
                <div class="forgot-password">
                    <a href="#" onclick="return false;">Forgot password?</a>
                </div>
            </div>
            
            <div class="signup-box">
                <p>Don't have an account? <a href="#" onclick="return false;">Sign up</a></p>
            </div>
            
            <div class="app-download">
                <p>Get the app.</p>
                <div class="app-buttons">
                    <a href="#" onclick="return false;">
                        <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_ios_english-en.png/180ae7a0bcf7.png" alt="Download on App Store">
                    </a>
                    <a href="#" onclick="return false;">
                        <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_android_english-en.png/e9cd846dc748.png" alt="Get it on Google Play">
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <footer>
        <div class="footer-links">
            <a href="#" onclick="return false;">About</a>
            <a href="#" onclick="return false;">Help</a>
            <a href="#" onclick="return false;">Press</a>
            <a href="#" onclick="return false;">API</a>
            <a href="#" onclick="return false;">Jobs</a>
            <a href="#" onclick="return false;">Privacy</a>
            <a href="#" onclick="return false;">Terms</a>
            <a href="#" onclick="return false;">Locations</a>
            <a href="#" onclick="return false;">Language</a>
        </div>
        <div class="copyright">
            <p>© 2024 Instagram Clone - Educational Purpose Only</p>
        </div>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
